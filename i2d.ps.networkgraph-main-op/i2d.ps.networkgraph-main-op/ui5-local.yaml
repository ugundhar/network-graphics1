specVersion: "2.6"
metadata:
  name: i2d.ps.networkgraph
type: application
framework:
  name: SAPUI5
  version: 1.115.1
  libraries:
    - name: sap.f
    - name: sap.fe.navigation
    - name: sap.m
    - name: sap.suite.ui.commons
    - name: sap.ui.comp
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.ui.generic.app
    - name: sap.ushell
    - name: sap.fe.placeholder
    - name: sap.ui.table
    - name: themelib_sap_bluecrystal
    - name: themelib_sap_fiori_3
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        backend:
          - path: /sap
            url: http://uytclnt928:443
            client: "928"
            destination: UYTCLNT928
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: i2d.ps.networkgraph
        ui5Theme: sap_fiori_3
